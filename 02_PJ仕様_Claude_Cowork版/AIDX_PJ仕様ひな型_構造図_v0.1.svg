<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-label="PJ仕様ひな型の構造図。管理・入力・プロンプト本体・品質・記録の5グループに固定章立てを整理し、PJ-01が記入済み見本であることを示す図">
  <rect width="1800" height="1120" rx="28" fill="#0c0c0e"/>

  <!-- header -->
  <text x="70" y="66" font-family="sans-serif" font-size="15" font-weight="700" fill="#ff8a3d" letter-spacing="2">PJ仕様ひな型（PJ-01準拠フォーマット）</text>
  <text x="70" y="112" font-family="sans-serif" font-size="30" font-weight="700" fill="#f5f5f5">全PJを同じ"型"に流し込む ― 固定の章立て</text>
  <text x="70" y="149" font-family="sans-serif" font-size="15" fill="#a8a29b">章立て（管理メタデータ＋①〜⑨）は固定。各PJは中身を差し替えるだけ。PJ-01がこの型の記入済み見本。</text>

  <!-- 右上バッジ -->
  <rect x="1500" y="52" width="240" height="66" rx="12" fill="#14211b" stroke="#7fc98b" stroke-width="2"/>
  <text x="1620" y="80" font-family="sans-serif" font-size="12.5" fill="#a8a29b" text-anchor="middle">固定フォーマット</text>
  <text x="1620" y="103" font-family="sans-serif" font-size="15" font-weight="700" fill="#f5f5f5" text-anchor="middle">メタデータ＋①〜⑨</text>

  <!-- ===== Group A: 管理 ===== -->
  <rect x="60" y="196" width="1680" height="150" rx="16" fill="#131316" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="88" cy="234" r="8" fill="#4a9eff"/>
  <text x="106" y="241" font-family="sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">A. 管理 ― 版を管理し、追跡できるようにする</text>
  <text x="1710" y="241" font-family="sans-serif" font-size="13" fill="#8a857d" text-anchor="end">誰が使う：PM（レビュー）</text>
  <g font-family="sans-serif">
    <rect x="88" y="262" width="405" height="64" rx="10" fill="#101725" stroke="#2c3a52" stroke-width="1.2"/>
    <text x="106" y="288" font-size="14.5" font-weight="700" fill="#cfe3ff">管理メタデータ</text>
    <text x="106" y="311" font-size="12.5" fill="#9fb6d8">PJ番号・版・作成者・status(draft→review→fixed)</text>
    <rect x="509" y="262" width="405" height="64" rx="10" fill="#101725" stroke="#2c3a52" stroke-width="1.2"/>
    <text x="527" y="288" font-size="14.5" font-weight="700" fill="#cfe3ff">版の位置づけ</text>
    <text x="527" y="311" font-size="12.5" fill="#9fb6d8">この版の目的・前版からの変更点</text>
    <rect x="930" y="262" width="405" height="64" rx="10" fill="#101725" stroke="#2c3a52" stroke-width="1.2"/>
    <text x="948" y="288" font-size="14.5" font-weight="700" fill="#cfe3ff">① 目的・適用範囲</text>
    <text x="948" y="311" font-size="12.5" fill="#9fb6d8">何を・どの場面で・対象/対象外</text>
  </g>

  <!-- ===== Group B: 入力の型 ===== -->
  <rect x="60" y="362" width="1680" height="150" rx="16" fill="#131316" stroke="#e6c34a" stroke-width="1.5"/>
  <circle cx="88" cy="400" r="8" fill="#e6c34a"/>
  <text x="106" y="407" font-family="sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">B. 入力の型 ― 何を・どう渡すか</text>
  <text x="1710" y="407" font-family="sans-serif" font-size="13" fill="#8a857d" text-anchor="end">誰が使う：現場担当（入力を用意）</text>
  <g font-family="sans-serif">
    <rect x="88" y="428" width="620" height="64" rx="10" fill="#211d14" stroke="#5c4f24" stroke-width="1.2"/>
    <text x="106" y="454" font-size="14.5" font-weight="700" fill="#f0dca0">② 入力（形式・必須/任意・前提）</text>
    <text x="106" y="477" font-size="12.5" fill="#cbb877">何を渡すか。音声は「文字起こし後テキスト」で渡す ★v0.4</text>
    <rect x="724" y="428" width="611" height="64" rx="10" fill="#211d14" stroke="#5c4f24" stroke-width="1.2"/>
    <text x="742" y="454" font-size="14.5" font-weight="700" fill="#f0dca0">③ 案件フォルダ構成</text>
    <text x="742" y="477" font-size="12.5" fill="#cbb877">01_入力 / 02_出力 / 03_品質確認 の置き場所</text>
  </g>
  <!-- v0.4 強調バッジ -->
  <rect x="1355" y="428" width="360" height="64" rx="10" fill="#12130f" stroke="#e6c34a" stroke-width="1.4"/>
  <text x="1375" y="452" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e6c34a">★ v0.4の要点（全PJ共通）</text>
  <text x="1375" y="475" font-family="sans-serif" font-size="12" fill="#cbb877">生音声を直接渡さない＝文字起こし後に渡す</text>

  <!-- ===== Group C: プロンプト本体 ===== -->
  <rect x="60" y="528" width="1680" height="248" rx="16" fill="#16211a" stroke="#7fc98b" stroke-width="2"/>
  <circle cx="88" cy="566" r="8" fill="#7fc98b"/>
  <text x="106" y="573" font-family="sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">C. AIへの指示 ＝ プロンプト本体（この型の中心）</text>
  <text x="1710" y="573" font-family="sans-serif" font-size="13" fill="#9fc7ad" text-anchor="end">誰が使う：西村・渡部（量産）</text>
  <text x="106" y="600" font-family="sans-serif" font-size="13" fill="#9fc7ad">④ P-0XX ― 下の7ブロックを必ず全部そろえる（見出しは固定、中身をPJごとに差し替え）</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="106" y="616" width="223" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="217" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">役割</text><text x="217" y="663" font-size="11" fill="#9fc7ad">何をする係か</text>
    <rect x="341" y="616" width="223" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="452" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">入力の受け取り方</text><text x="452" y="663" font-size="11" fill="#9fc7ad">どのファイルを読む</text>
    <rect x="576" y="616" width="223" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="687" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">絶対ルール</text><text x="687" y="663" font-size="11" fill="#9fc7ad">事実を作らない 等</text>
    <rect x="811" y="616" width="223" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="922" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">作業手順</text><text x="922" y="663" font-size="11" fill="#9fc7ad">整理→構造化→自己監査</text>
    <rect x="1046" y="616" width="270" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="1181" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">品質確認（自動実行）</text><text x="1181" y="663" font-size="11" fill="#9fc7ad">AIが自分を監査</text>
    <rect x="1328" y="616" width="215" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="1435" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">出力形式</text><text x="1435" y="663" font-size="11" fill="#9fc7ad">成果物の章立て</text>
    <rect x="1555" y="616" width="160" height="60" rx="9" fill="#12190f" stroke="#3f6a43" stroke-width="1.2"/><text x="1635" y="644" font-size="13.5" font-weight="700" fill="#dfeee5">保存</text><text x="1635" y="663" font-size="11" fill="#9fc7ad">02_出力・版上げ</text>
  </g>
  <text x="106" y="712" font-family="sans-serif" font-size="12.5" fill="#7fc98b">この7ブロックが「AIに何をどう頼むか」の本体。ここを丁寧に書くほど、誰が実行しても同じ品質になる。</text>
  <rect x="106" y="726" width="1609" height="34" rx="8" fill="#12190f" stroke="#2c3a30" stroke-width="1"/>
  <text x="122" y="748" font-family="sans-serif" font-size="12.5" fill="#9fc7ad">出力形式の最後には必ず「品質確認結果（自動実行）」を入れる ― 案と監査を1つの出力で出し、確定は人が行う。</text>

  <!-- ===== Group D: 品質を担保 ===== -->
  <rect x="60" y="792" width="1680" height="150" rx="16" fill="#131316" stroke="#ff8a3d" stroke-width="1.5"/>
  <circle cx="88" cy="830" r="8" fill="#ff8a3d"/>
  <text x="106" y="837" font-family="sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">D. 品質を担保する ― AIの自己監査＋人の最終確認</text>
  <text x="1710" y="837" font-family="sans-serif" font-size="13" fill="#8a857d" text-anchor="end">誰が使う：品質確認担当・責任者</text>
  <g font-family="sans-serif">
    <rect x="88" y="858" width="530" height="64" rx="10" fill="#221609" stroke="#5c3f1c" stroke-width="1.2"/>
    <text x="106" y="884" font-size="14.5" font-weight="700" fill="#ffc79a">⑤ 自動QA（品質確認）の設計</text>
    <text x="106" y="907" font-size="12.5" fill="#d8b389">AIが自分の出力を照合。判定は合格候補/要修正/保留</text>
    <rect x="634" y="858" width="530" height="64" rx="10" fill="#221609" stroke="#5c3f1c" stroke-width="1.2"/>
    <text x="652" y="884" font-size="14.5" font-weight="700" fill="#ffc79a">⑥ 人手確認チェックリスト</text>
    <text x="652" y="907" font-size="12.5" fill="#d8b389">確認項目/目的/誰のため（PJ-01の11項目が基準）</text>
    <rect x="1180" y="858" width="535" height="64" rx="10" fill="#221609" stroke="#5c3f1c" stroke-width="1.2"/>
    <text x="1198" y="884" font-size="14.5" font-weight="700" fill="#ffc79a">⑦ 禁止事項</text>
    <text x="1198" y="907" font-size="12.5" fill="#d8b389">推測補完・自動確定・他ツール名の記載を禁止</text>
  </g>

  <!-- ===== Group E: 記録・改善 ===== -->
  <rect x="60" y="958" width="1680" height="96" rx="16" fill="#131316" stroke="#8b7dff" stroke-width="1.5"/>
  <circle cx="88" cy="996" r="8" fill="#8b7dff"/>
  <text x="106" y="1003" font-family="sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">E. 記録・改善 ― 再現性とトレース</text>
  <g font-family="sans-serif">
    <rect x="620" y="978" width="540" height="56" rx="10" fill="#171622" stroke="#3a3358" stroke-width="1.2"/>
    <text x="638" y="1002" font-size="14" font-weight="700" fill="#d7d0f0">⑧ 自己検証結果</text>
    <text x="638" y="1023" font-size="12" fill="#afa6d6">必須構造・事実補完0件・要確認件数・総合判定</text>
    <rect x="1176" y="978" width="539" height="56" rx="10" fill="#171622" stroke="#3a3358" stroke-width="1.2"/>
    <text x="1194" y="1002" font-size="14" font-weight="700" fill="#d7d0f0">⑨ 変更履歴・チューニング記録</text>
    <text x="1194" y="1023" font-size="12" fill="#afa6d6">Round/変更/テスト/結果/承認者。旧版は保持</text>
  </g>
  <text x="88" y="1030" font-family="sans-serif" font-size="12.5" fill="#afa6d6">同じ品質を再現し、変更を追う。</text>
</svg>
